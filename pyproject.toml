[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ionmonger-py"
version = "0.1.0"
description = "Python drift-diffusion/ion-migration simulator for planar PSC devices"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "h5py>=3.9",
  "joblib>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
